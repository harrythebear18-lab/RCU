# Homelab Tools - Basic Configuration
# Edit these settings as needed

# Performance settings
update_interval = 1000  # milliseconds
cache_size = 100       # MB

# Network settings  
timeout = 30           # seconds
max_connections = 10

# Logging
log_level = "INFO"
log_file = "logs/homelab.log"

# GPU support (if available)
gpu_enabled = True

# Display settings
theme = "dark"
window_size = "1200x800"
